[package]
name = "s2_reflection"
version = "0.0.0"
edition = "2024"
publish = false

# Spike: its own workspace, excluded from the main build.
[workspace]

[dependencies]
box_core = { path = "../../crates/box_core" }
bevy_reflect = { version = "=0.20.1", default-features = false, features = [
    "std",
    "debug",
    "uuid",
    "reflect_documentation",
] }
glam = "0.34.3"
uuid = { version = "1.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
