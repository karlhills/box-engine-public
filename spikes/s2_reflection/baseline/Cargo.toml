# Compile-time baseline for S2: the same components with serde derives only,
# no bevy_reflect. Its own workspace so it builds independently.
[package]
name = "s2_baseline"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
box_core = { path = "../../../crates/box_core" }
glam = { version = "0.34.3", features = ["serde"] }
uuid = { version = "1.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
