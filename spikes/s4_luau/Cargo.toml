[package]
name = "s4_luau"
version = "0.0.0"
edition = "2024"
publish = false

# Spike: its own workspace, excluded from the main build.
[workspace]

[dependencies]
box_core = { path = "../../crates/box_core" }
mlua = { version = "=0.12.2", features = ["luau", "vendored", "serialize"] }
glam = "0.33.12"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
