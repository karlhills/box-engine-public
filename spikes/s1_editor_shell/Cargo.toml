[package]
name = "s1_editor_shell"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
egui = "0.37"
egui-winit = "0.37"
egui-wgpu = { version = "0.37", features = ["winit"] }
egui_tiles = "0.18"
wgpu = "30.0.2"
winit = "0.30.13"
pollster = "0.4"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
