    { path = "f32::sin", reason = "use box_core::pmath::sin (portable, D17)" },
    { path = "f32::cos", reason = "use box_core::pmath::cos (portable, D17)" },
    { path = "f32::sin_cos", reason = "use box_core::pmath::sin_cos (portable, D17)" },
