[package]
name = "box_editor"
description = "box-engine editor: shell, docking, viewport and panels (a library; apps/editor is the binary)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
box_assets.workspace = true
box_core.workspace = true
box_render.workspace = true
box_engine.workspace = true
# File ▸ Export… (box_export, the same code as `box export`).
box_export.workspace = true
# Dynamics on: the editor inspects and plays scenes with rigid bodies.
box_physics = { workspace = true, features = ["dynamics"] }
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
egui_tiles.workspace = true
winit.workspace = true
glam.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
profiling.workspace = true
rfd.workspace = true

[dev-dependencies]
image.workspace = true
bevy_reflect.workspace = true
proptest.workspace = true
box_proc.workspace = true

[lints]
workspace = true
